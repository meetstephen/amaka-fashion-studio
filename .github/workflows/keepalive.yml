name: Supabase Keep-Alive

on:
  schedule:
    # Spread requests across the day to avoid GitHub's top-of-hour congestion.
    - cron: "17 6 * * *"
    - cron: "41 14 * * *"
    - cron: "53 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Keep Supabase active
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Add these repository Actions secrets from the existing Vercel values:
      # NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Verify configuration
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Missing Actions secret SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "::error::Missing Actions secret SUPABASE_ANON_KEY"; exit 1; }

      - name: Run a lightweight database query
        run: |
          curl --fail --silent --show-error --get \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --data-urlencode "select=id" \
            --data-urlencode "limit=1" \
            "${SUPABASE_URL%/}/rest/v1/images"
